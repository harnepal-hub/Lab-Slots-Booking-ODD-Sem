<!-- SECTION 3: MONTHLY & WEEKLY TIMETABLE GENERATOR -->
<section class="lg:col-span-12 bg-gitam-card p-6 rounded-xl shadow-sm border border-gitam-border mt-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gitam-border pb-4 mb-4">
        <div>
            <h2 class="text-lg font-bold text-gitam-teal uppercase tracking-wide">Monthly Lab Timetable Matrix</h2>
            <p class="text-xs text-slate-500">View lab utilization across all 5 labs and 2-hour slots for any selected date range.</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <div>
                <label class="block text-[10px] font-bold uppercase text-slate-600">Filter Month</label>
                <input type="month" id="matrixMonth" min="2026-07" max="2026-11" value="2026-07" onchange="generateMonthlyMatrix()" class="p-1.5 text-xs border border-slate-300 rounded-md outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase text-slate-600">Filter Lab</label>
                <select id="matrixLab" onchange="generateMonthlyMatrix()" class="p-1.5 text-xs border border-slate-300 rounded-md outline-none bg-white">
                    <option value="ALL">All Labs</option>
                    <option value="Maker Space">Maker Space</option>
                    <option value="Computer Lab">Computer Lab</option>
                    <option value="VR Lab">VR Lab</option>
                    <option value="Climo Lab">Climo Lab</option>
                    <option value="3D Printer Lab">3D Printer Lab</option>
                    <option value="Art Court">Art Court</option>
                </select>
            </div>
            <button onclick="exportToCSV()" class="mt-4 md:mt-0 bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-md text-xs font-bold uppercase tracking-wider flex items-center gap-1 shadow">
                <span>📥 Export CSV / Excel</span>
            </button>
        </div>
    </div>

    <!-- Timetable Matrix View -->
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
            <thead>
                <tr class="bg-gitam-teal text-white uppercase text-[10px] tracking-wider">
                    <th class="p-2.5 border border-emerald-900">Date</th>
                    <th class="p-2.5 border border-emerald-900">Lab Facility</th>
                    <th class="p-2.5 border border-emerald-900">08:00 AM - 10:00 AM</th>
                    <th class="p-2.5 border border-emerald-900">10:00 AM - 12:00 PM</th>
                    <th class="p-2.5 border border-emerald-900 bg-emerald-900 text-slate-300 text-center">12-1 PM</th>
                    <th class="p-2.5 border border-emerald-900">01:00 PM - 03:00 PM</th>
                    <th class="p-2.5 border border-emerald-900">03:00 PM - 05:00 PM</th>
                </tr>
            </thead>
            <tbody id="matrixTableBody" class="divide-y divide-slate-200">
                <!-- Dynamically Populated by app.js -->
            </tbody>
        </table>
    </div>
</section>
